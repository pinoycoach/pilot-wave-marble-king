<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        src: url("./fonts/instrument-serif-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400;
        src: url("./fonts/ibm-plex-sans-400.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0c0a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse 72% 64% at 50% 46%, #141412 0%, #0c0c0a 72%),
          #0c0c0a;
        color: #eceae4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .plate {
        position: absolute;
        inset: 36px;
        border: 1px solid rgb(236 234 228 / 0.08);
        pointer-events: none;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.11;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.86  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
      }
      .lockup {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
      .wordmark {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: 0.012em;
        color: #eceae4;
        font-kerning: normal;
      }
      .fingerprint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 72px;
        margin-top: 36px;
      }
      .fingerprint span {
        display: block;
        width: 5px;
        border-radius: 2px;
      }
      .label {
        margin-top: 32px;
        font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #9a9890;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="plate"></div>
      <div class="lockup">
        <div class="wordmark">Voice Lab</div>
        <div class="fingerprint" aria-hidden="true">
          <span style="height: 28px; background: #8aa396"></span>
          <span style="height: 48px; background: #8aa396"></span>
          <span style="height: 36px; background: #c45c4a"></span>
          <span style="height: 62px; background: #8aa396"></span>
          <span style="height: 22px; background: #c45c4a"></span>
          <span style="height: 70px; background: #8aa396"></span>
          <span style="height: 40px; background: #c45c4a"></span>
          <span style="height: 54px; background: #8aa396"></span>
          <span style="height: 30px; background: #c45c4a"></span>
          <span style="height: 46px; background: #8aa396"></span>
          <span style="height: 32px; background: #8aa396"></span>
        </div>
        <div class="label">Write · Measure · Mix</div>
      </div>
      <div class="grain"></div>
    </div>
  </body>
</html>
